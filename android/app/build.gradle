plugins { id 'com.android.application' }

def signingFile = rootProject.file('keystore.properties')
def signingValues = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingValues.load(it) }
}

android {
    namespace 'com.j777ml.app'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.j777ml.app'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (signingFile.exists()) { signingConfig signingConfigs.release }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }

tasks.configureEach {
    if (name == 'validateSigningRelease') {
        doFirst {
            if (!signingFile.exists()) {
                throw new GradleException('Release signing is missing. Run build-apk.ps1 -InitializeSigning once.')
            }
        }
    }
}
